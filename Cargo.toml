[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-wasm",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = 0 }
