[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-wasm",
    "crates/terminal-ui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
publish = false
license = "MIT"

[workspace.dependencies]
bevy_ecs = { version = "0.20", default-features = false }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = 0 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
